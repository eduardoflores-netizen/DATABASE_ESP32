<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESP32 Quantum Control</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  background: radial-gradient(circle at top, #0f0f1a, #050510);
  color:#00ffff;
  font-family: 'Segoe UI', sans-serif;
}
.card{
  background: rgba(0,255,255,0.05);
  border:1px solid rgba(0,255,255,0.3);
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
  backdrop-filter: blur(10px);
  border-radius:20px;
  padding:25px;
}
.btn{
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  transition:0.2s;
}
.btn-on{
  background:#00ffff;
  color:black;
  box-shadow:0 0 15px #00ffff;
}
.btn-off{
  background:#111827;
  border:1px solid #00ffff;
}
.status{
  padding:8px 15px;
  border-radius:30px;
  display:inline-block;
}
</style>
</head>

<body class="p-6">

<h1 class="text-3xl font-bold mb-6 text-center">⚡ ESP32 QUANTUM CONTROL ⚡</h1>

<div id="status" class="status bg-red-600 text-white mb-6">Desconectado</div>

<div class="grid md:grid-cols-2 gap-6">

  <div class="card text-center">
    <h2 class="text-xl mb-4">Sala Principal</h2>
    <button onclick="updateState('sala', true)" class="btn btn-on w-full mb-2">ENCENDER</button>
    <button onclick="updateState('sala', false)" class="btn btn-off w-full">APAGAR</button>
  </div>

  <div class="card text-center">
    <h2 class="text-xl mb-4">Laboratorio</h2>
    <button onclick="updateState('laboratorio', true)" class="btn btn-on w-full mb-2">ENCENDER</button>
    <button onclick="updateState('laboratorio', false)" class="btn btn-off w-full">APAGAR</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

let db;

function pedirDatos(){
Swal.fire({
title:'Configurar Firebase',
html:
'<input id="apiKey" class="swal2-input" placeholder="API KEY">'+
'<input id="dbUrl" class="swal2-input" placeholder="DATABASE URL">',
confirmButtonText:'Conectar'
}).then(r=>{
if(r.value){
localStorage.setItem("apiKey", apiKey.value);
localStorage.setItem("dbUrl", dbUrl.value);
initFirebase(apiKey.value, dbUrl.value);
}
});
}

function initFirebase(apiKey,databaseURL){
const app = initializeApp({apiKey,databaseURL});
db=getDatabase(app);
onValue(ref(db,'casa'),()=>{
status.innerText="Conectado a Firebase";
status.className="status bg-green-600 text-white";
});
}

window.updateState=(foco,estado)=>{
if(!db) return Swal.fire("Configura Firebase primero");
set(ref(db,'casa/'+foco),estado);
}

const k=localStorage.getItem("apiKey");
const u=localStorage.getItem("dbUrl");
if(k&&u){initFirebase(k,u);}else{pedirDatos();}
</script>

</body>
</html>
