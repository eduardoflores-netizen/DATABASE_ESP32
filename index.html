<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Control IoT ESP32</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  body { background:#0f172a; color:white; font-family:sans-serif; }
  .card { background:#1e293b; padding:20px; border-radius:16px; margin:15px 0; }
  button { padding:10px 15px; border-radius:10px; font-weight:bold; }
</style>
</head>

<body class="p-6">

<h1 class="text-2xl font-bold mb-4">Control IoT ESP32</h1>

<div id="status" class="mb-4 text-red-400">Desconectado</div>

<div class="card">
  <h2>Sala</h2>
  <button onclick="updateState('sala', true)" class="bg-yellow-400 text-black">ON</button>
  <button onclick="updateState('sala', false)" class="bg-gray-600">OFF</button>
</div>

<div class="card">
  <h2>Laboratorio</h2>
  <button onclick="updateState('laboratorio', true)" class="bg-blue-400 text-black">ON</button>
  <button onclick="updateState('laboratorio', false)" class="bg-gray-600">OFF</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

let db;

function pedirDatos() {
  Swal.fire({
    title: 'Configurar Firebase',
    html:
      '<input id="apiKey" class="swal2-input" placeholder="API KEY">' +
      '<input id="dbUrl" class="swal2-input" placeholder="DATABASE URL">',
    confirmButtonText: 'Conectar',
    focusConfirm: false,
    preConfirm: () => {
      return {
        apiKey: document.getElementById('apiKey').value,
        dbUrl: document.getElementById('dbUrl').value
      }
    }
  }).then(result => {
    if(result.value){
      localStorage.setItem("apiKey", result.value.apiKey);
      localStorage.setItem("dbUrl", result.value.dbUrl);
      initFirebase(result.value.apiKey, result.value.dbUrl);
    }
  });
}

function initFirebase(apiKey, databaseURL){
  const firebaseConfig = { apiKey, databaseURL };
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);

  const casaRef = ref(db, 'casa');
  onValue(casaRef, (snapshot)=>{
    document.getElementById("status").innerText="Conectado a Firebase";
    document.getElementById("status").className="text-green-400";
  });
}

window.updateState = function(foco, estado){
  if(!db) return Swal.fire("Configura primero");
  set(ref(db, 'casa/' + foco), estado);
}

const savedKey = localStorage.getItem("apiKey");
const savedUrl = localStorage.getItem("dbUrl");

if(savedKey && savedUrl){
  initFirebase(savedKey, savedUrl);
}else{
  pedirDatos();
}
</script>

</body>
</html>
